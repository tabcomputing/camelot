name: Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Every package is built by the same `just pkg-*` recipe a developer runs
  # locally, inside a container on the host runner (uploads from inside a
  # `container:` job are refused for this repository).
  build:
    name: ${{ matrix.name }} Package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch
            recipe: pkg-arch-container
            artifact: camelot-arch
            glob: "pkg/*.pkg.tar.zst"
          - name: Debian
            recipe: pkg-deb
            artifact: camelot-deb
            glob: |
              pkg/camelot_*.deb
              pkg/camelot-gtk_*.deb
          - name: Fedora
            recipe: pkg-rpm
            artifact: camelot-rpm
            glob: "pkg/*.rpm"
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version: //p' shard.yml)"
          if [ "${{ github.event_name }}" = "release" ] && [ "$TAG_NAME" != "v$version" ]; then
            echo "tag $TAG_NAME does not match shard.yml version v$version"
            exit 1
          fi

      - name: Build ${{ matrix.name }} package
        run: CONTAINER=docker just ${{ matrix.recipe }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}

  release-assets:
    name: Upload Release Assets
    if: github.event_name == 'release'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            camelot-arch/*.pkg.tar.zst
            camelot-deb/*.deb
            camelot-rpm/*.x86_64.rpm
