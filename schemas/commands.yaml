# Camelot CLI, one Jargon schema per subcommand. Embedded at compile time
# (see src/cli.cr); the same JSON Schema doubles as the MCP tool contract.
---
$id: output
properties:
  format:
    type: string
    enum: [text, json, yaml]
    default: text
    short: f
    description: Output format
---
$id: snapshot
properties:
  max-text:
    type: integer
    default: 200
    description: Max characters of text content per node (0 = none, -1 = unlimited)
  no-extents:
    type: boolean
    description: Omit position and size
  actions:
    type: boolean
    short: a
    description: Include the actions each node offers
  all-states:
    type: boolean
    description: Keep the noisy states too (enabled, visible, showing...)
  raw:
    type: boolean
    description: Keep anonymous layout containers instead of pruning them
  hidden:
    type: boolean
    description: Include hidden widgets (collapsed menus, closed dialogs, background tabs)
---
name: apps
description: List applications on the accessibility bus
allOf:
  - {$ref: output}
---
name: windows
description: List top-level windows, the active one flagged
allOf:
  - {$ref: output}
  - {$ref: snapshot}
  - properties:
      app:
        type: string
        description: Only this application (name, substring, or pid)
---
name: tree
description: Dump the accessible tree of an application
positional: [app]
allOf:
  - {$ref: output}
  - {$ref: snapshot}
  - properties:
      app:
        type: string
        description: "Application name, substring, or pid (default: the active window's app)"
      depth:
        type: integer
        default: -1
        short: d
        description: How many levels to descend (-1 = unlimited)
      path:
        type: string
        short: p
        description: Start at this index path within the app (e.g. 0/3/1)
required: []
---
name: focus
description: Show the widget that has keyboard focus
allOf:
  - {$ref: output}
  - {$ref: snapshot}
  - properties:
      max-text: {type: integer, default: 4000}
      depth:
        type: integer
        default: 0
        short: d
        description: Also descend into the focused widget this many levels
---
name: at
description: Show the widget under a point, relative to the active window
positional: [x, y]
allOf:
  - {$ref: output}
  - {$ref: snapshot}
  - properties:
      x: {type: integer, description: X offset from the window's left edge}
      y: {type: integer, description: Y offset from the window's top edge}
      app:
        type: string
        description: Look in this application's window instead of the active one
      screen:
        type: boolean
        short: s
        description: Treat x,y as absolute screen coordinates and search every window (X11 apps only)
required: [x, y]
---
name: context
description: "Snapshot of what the user is doing: app, window, focused widget and its text"
allOf:
  - {$ref: output}
  - properties:
      max-text:
        type: integer
        default: 4000
        description: Max characters of text kept around the caret (-1 = unlimited)
---
name: watch
description: "Stream accessibility events as they happen: window switches, focus changes, typing"
allOf:
  - {$ref: output}
  - properties:
      events:
        type: array
        items: {type: string}
        short: e
        description: "AT-SPI event types to subscribe to (default: window/focus/text events)"
      duration:
        type: integer
        default: 0
        short: t
        description: Stop after this many seconds (0 = run until interrupted)
      stats:
        type: integer
        default: 0
        description: Print an event-count line to stderr every N seconds (0 = off)
---
name: recent
description: "What the user has been doing lately: window switches, focus changes, edits (needs the daemon)"
allOf:
  - {$ref: output}
  - properties:
      seconds:
        type: integer
        default: 60
        short: s
        description: How far back to look
      limit:
        type: integer
        default: 50
        short: n
        description: Most recent entries to return
      raw:
        type: boolean
        description: Every event as recorded, instead of the coalesced digest
---
name: status
description: Is the daemon running, and what does it hold
allOf:
  - {$ref: output}
---
name: pause
description: Stop the daemon recording (it keeps running and answering); `resume` undoes it
properties: {}
---
name: resume
description: Resume recording after `pause`
properties: {}
---
name: reload
description: Make the daemon re-read its config file
properties: {}
---
name: pointer
description: "What is under the mouse pointer: the window and the widget (on Wayland, needs the camelot GNOME Shell extension)"
allOf:
  - {$ref: output}
  - {$ref: snapshot}
  - properties:
      delay:
        type: integer
        default: 0
        description: Wait this many seconds first, to put the pointer somewhere
---
name: shot
description: Capture the screen through the desktop portal (the desktop announces it; nothing is recorded)
properties:
  pick:
    type: boolean
    short: p
    description: Let the desktop's picker choose a window or region
  output:
    type: string
    short: o
    format: path
    description: "Write the image here (default: stdout)"
  max-edge:
    type: integer
    default: 1568
    description: Scale so the long edge is at most this (0 = full size)
  quality:
    type: integer
    default: 80
    minimum: 1
    maximum: 100
    description: JPEG quality
---
name: subscribe
description: "Stream the daemon's recorded events and state changes as JSON lines (backfill first); Ctrl-C to stop"
properties:
  seconds:
    type: integer
    short: s
    description: "How much history to backfill (default: everything retained)"
---
name: daemon
description: Run the background service that keeps the bus warm and records activity for `recent`
properties:
  socket:
    type: string
    description: "Unix socket to listen on (default: $XDG_RUNTIME_DIR/camelot.sock)"
  history:
    type: integer
    description: "Events to keep (default: config `history`, else 2000)"
---
name: mcp
description: Serve the commands above as MCP tools over stdio (for Claude Code and other MCP clients)
properties: {}
